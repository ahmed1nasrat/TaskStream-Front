<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TaskStream</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'surface-dim': '#d9d9e5',
            'on-primary-container': '#eeefff',
            'error-container': '#ffdad6',
            'tertiary-container': '#bc4800',
            'secondary-container': '#d0e1fb',
            'on-primary-fixed': '#00174b',
            'tertiary-fixed': '#ffdbcd',
            'on-surface-variant': '#434655',
            'inverse-primary': '#b4c5ff',
            'surface-bright': '#faf8ff',
            'secondary': '#505f76',
            'surface-container-high': '#e7e7f3',
            'on-primary': '#ffffff',
            'on-tertiary-fixed': '#360f00',
            'secondary-fixed-dim': '#b7c8e1',
            'on-tertiary': '#ffffff',
            'on-tertiary-fixed-variant': '#7d2d00',
            'on-background': '#191b23',
            'on-error': '#ffffff',
            'tertiary': '#943700',
            'surface-variant': '#e1e2ed',
            'tertiary-fixed-dim': '#ffb596',
            'on-secondary-fixed': '#0b1c30',
            'outline': '#737686',
            'primary-container': '#2563eb',
            'surface-container-low': '#f3f3fe',
            'on-secondary-fixed-variant': '#38485d',
            'primary-fixed-dim': '#b4c5ff',
            'on-tertiary-container': '#ffede6',
            'error': '#ba1a1a',
            'on-secondary': '#ffffff',
            'primary-fixed': '#dbe1ff',
            'surface-container-highest': '#e1e2ed',
            'inverse-surface': '#2e3039',
            'surface-container': '#ededf9',
            'on-surface': '#191b23',
            'on-secondary-container': '#54647a',
            'on-error-container': '#93000a',
            'surface-container-lowest': '#ffffff',
            'primary': '#004ac6',
            'surface': '#faf8ff',
            'surface-tint': '#0053db',
            'outline-variant': '#c3c6d7',
            'secondary-fixed': '#d3e4fe',
            'inverse-on-surface': '#f0f0fb',
            'background': '#faf8ff',
            'on-primary-fixed-variant': '#003ea8',
          },
          borderRadius: {
            DEFAULT: '0.25rem',
            lg: '0.5rem',
            xl: '0.75rem',
            full: '9999px',
          },
          spacing: {
            base: '4px',
            lg: '24px',
            md: '16px',
            xl: '32px',
            gutter: '24px',
            xs: '4px',
            'margin-mobile': '16px',
            '2xl': '48px',
            sm: '8px',
            'margin-desktop': '32px',
          },
          fontFamily: {
            'label-md': ['Inter'],
            'body-md': ['Inter'],
            'headline-md': ['Inter'],
            'display-lg-mobile': ['Inter'],
            'body-lg': ['Inter'],
            'headline-sm': ['Inter'],
            'label-sm': ['Inter'],
            'display-lg': ['Inter'],
          },
          fontSize: {
            'label-md': ['13px', { lineHeight: '18px', fontWeight: '500' }],
            'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
            'headline-md': ['24px', { lineHeight: '32px', letterSpacing: '-0.01em', fontWeight: '600' }],
            'display-lg-mobile': ['28px', { lineHeight: '34px', letterSpacing: '-0.02em', fontWeight: '700' }],
            'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }],
            'headline-sm': ['18px', { lineHeight: '28px', fontWeight: '600' }],
            'label-sm': ['12px', { lineHeight: '16px', letterSpacing: '0.01em', fontWeight: '500' }],
            'display-lg': ['36px', { lineHeight: '44px', letterSpacing: '-0.02em', fontWeight: '700' }],
          },
        },
      },
    };

</head>

  <app-root></app-root>
</body>
</html>
